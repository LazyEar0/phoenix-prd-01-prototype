<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix · AI 原生操作系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="styles.css?v=20261008-5">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div id="view-login" class="login-wrap hidden">
  <canvas id="aurora-cv" class="aurora-cv"></canvas>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="0 0 48 48" fill="none">
          <defs>
            <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
            <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
            <linearGradient id="lg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
          </defs>
          <path d="M24 4c3 8 2 14-2 20-3-7-2-14 2-20z" fill="url(#lg2)"/>
          <path d="M24 44c-8-2-14-8-15-16 7-1 13 2 17 8 1 3 0 6-2 8z" fill="url(#lg1)"/>
          <path d="M24 44c8-2 14-8 15-16-7-1-13 2-17 8-1 3 0 6 2 8z" fill="url(#lg3)"/>
        </svg>
      </div>
      <div class="login-title">Phoenix</div>
      <div class="login-sub">AI 原生操作系统</div>
    </div>
    <div class="login-form">
      <label class="field">
        <span class="field-label">用户名</span>
        <input id="login-username" type="text" placeholder="请输入用户名" autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <span class="pwd-wrap">
          <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
          <button type="button" id="login-pwd-toggle" class="pwd-toggle" title="显示/隐藏密码">👁</button>
        </span>
      </label>
      <label class="login-remember">
        <input id="login-remember" type="checkbox" checked>
        <span>记住我</span>
      </label>
      <div id="login-error" class="login-error hidden"></div>
      <button id="login-btn" class="btn btn-primary btn-block btn-star">登 录</button>
    </div>
    <div class="login-foot">
      <span>预置管理员账号 admin / 123456</span>
      <button id="login-reset" class="link-btn" type="button">重置演示数据</button>
    </div>
  </div>
</div>

<!-- ========== 系统壳 ========== -->
<div id="shell" class="shell hidden">
  <aside id="rail" class="rail"><!-- JS 渲染导航 --></aside>
  <div class="main-col">
    <header id="topbar" class="topbar"><!-- JS 渲染顶栏 --></header>
    <div id="backend-banner" class="backend-banner hidden">后端连接已断开，正在重连…</div>
    <main class="main-view">
      <div class="demo-area">
        <section id="view-chat" class="view hidden">
          <div class="chat-layout">
            <aside id="chat-sidebar" class="chat-sidebar"></aside>
            <div id="chat-main" class="chat-main"></div>
          </div>
        </section>
        <section id="view-agents" class="view hidden"></section>
        <section id="view-models" class="view hidden"></section>
        <section id="view-users" class="view hidden"></section>
        <section id="view-search" class="view hidden"></section>
      </div>
      <!-- 需求澄清面板（评审模式，默认收起）：演示区操作联动右侧需求说明 -->
      <!-- 拖拽分隔条：按住左右拖动调整面板宽度，双击恢复默认宽度 -->
      <div class="req-resizer req-hidden" id="req-resizer" role="separator" aria-orientation="vertical" title="拖拽调整面板宽度 · 双击恢复默认"></div>
      <aside id="req-panel" class="req-panel req-hidden" aria-label="需求澄清面板">
        <div class="req-head">
          <div class="req-head-main">
            <div class="req-head-t">需求澄清 · PRD-1</div>
            <div class="req-head-sub" id="req-cur">—</div>
          </div>
          <button class="modal-close" id="req-close" title="关闭需求澄清面板">×</button>
        </div>
        <div class="req-body">
          <nav class="req-nav" id="req-nav"></nav>
          <div class="req-content" id="req-content"></div>
        </div>
        <div class="req-foot">评审模式 · 内容源自《PRD-1 地基与主链路》v1.1，正式文本以 md 文档为准</div>
      </aside>
    </main>
  </div>
</div>

<!-- 通用挂载点 -->
<div id="toast-root" class="toast-root"></div>
<div id="modal-root"></div>

<!-- Mermaid 全屏查看 -->
<div id="mermaid-overlay" class="mermaid-overlay hidden">
  <div class="mermaid-overlay-bar">
    <span class="mermaid-overlay-title">图表查看</span>
    <span class="mermaid-overlay-tools">
      <button class="btn btn-ghost btn-sm" id="mm-zoom-out">−</button>
      <span id="mm-zoom-label" class="mm-zoom-label">100%</span>
      <button class="btn btn-ghost btn-sm" id="mm-zoom-in">＋</button>
      <button class="btn btn-ghost btn-sm" id="mm-zoom-fit">适应窗口</button>
      <button class="btn btn-ghost btn-sm" id="mm-close">关闭 Esc</button>
    </span>
  </div>
  <div class="mermaid-overlay-body" id="mm-body">
    <div id="mm-canvas" class="mm-canvas"></div>
  </div>
</div>

<script src="data.js?v=20261008-2"></script>
<script src="motion.js?v=20261008-1"></script>
<script src="requirements.js?v=20261008-1"></script>
<script src="reqpanel.js?v=20261008-1"></script>
<script src="app.js?v=20261008-4"></script>
</body>
</html>
